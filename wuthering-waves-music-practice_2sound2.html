<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鳴潮 古琴演奏練習サイト | Resonance Etude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0806;
    --bg-grad:#170f07;
    --surface:#171009;
    --surface-2:#20160c;
    --line:#3c2d16;
    --accent:#e8bd5c;
    --accent-soft:rgba(232,189,92,.16);
    --accent-dim:#8a6a2c;
    --text:#f6eddb;
    --text-mute:#a8977c;
    --font-display:'Rajdhani','Noto Sans JP',sans-serif;
    --font-body:'Noto Sans JP',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #241a0c 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #1c1409 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  .app{max-width:900px;margin:0 auto;padding:28px 20px 60px;}

  header{position:relative;padding:6px 2px 22px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .eyebrow{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.32em;color:var(--accent);
    text-transform:uppercase;opacity:.9;margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);font-weight:700;font-size:38px;letter-spacing:.03em;
    margin:0 0 6px;color:#fbf3df;
    text-shadow:0 0 24px rgba(232,189,92,.25);
  }
  h1 small{display:block;font-size:13px;font-weight:500;color:var(--text-mute);letter-spacing:.14em;margin-top:4px;font-family:var(--font-mono);}
  .tagline{color:var(--text-mute);font-size:14px;line-height:1.7;max-width:56ch;}

  #unlock{
    position:fixed;inset:0;background:rgba(6,4,2,.92);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:50;
    flex-direction:column;gap:16px;text-align:center;padding:20px;
  }
  #unlock p{color:var(--text-mute);font-size:13px;max-width:38ch;line-height:1.6;margin:0;}
  #unlockBtn{
    font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.08em;
    color:#241a06;background:var(--accent);border:none;border-radius:999px;
    padding:16px 40px;cursor:pointer;box-shadow:0 0 40px rgba(232,189,92,.45);
    transition:transform .15s ease;
  }
  #unlockBtn:hover{transform:translateY(-2px);}
  #unlockBtn:active{transform:translateY(0);}

  section{margin-bottom:26px;}
  .section-label{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--text-mute);margin-bottom:12px;
  }

  .sliders{display:flex;gap:22px;flex-wrap:wrap;}
  .slider-group{display:flex;flex-direction:column;gap:4px;min-width:160px;}
  .slider-group label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-mute);letter-spacing:.08em;display:flex;justify-content:space-between;}
  .slider-group input[type=range]{accent-color:var(--accent);}

  /* 音色切り替えUI */
  .sound-switch{
    position:fixed;
    left:0;
    right:0;
    top:46%;
    transform:translateY(-50%);
    z-index:20;
    pointer-events:none;
  }
  .sound-switch-btn{
    position:absolute;
    pointer-events:auto;
    width:150px;
    height:58px;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(25,22,18,.58);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 18px;
    font-family:var(--font-display);
    font-weight:700;
    transition:.18s ease;
    box-shadow:0 4px 18px rgba(0,0,0,.22);
  }
  .sound-switch-btn.left{
    left:0;
    border-radius:0 30px 30px 0;
    justify-content:flex-end;
  }
  .sound-switch-btn.right{
    right:0;
    border-radius:30px 0 0 30px;
    justify-content:flex-start;
  }
  .sound-switch-btn .set-number{
    font-family:var(--font-mono);
    font-size:14px;
    min-width:22px;
    height:22px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    background:rgba(255,255,255,.88);
    color:#5b5b5b;
  }
  .sound-switch-btn .set-icon{
    font-size:28px;
    line-height:1;
  }
  .sound-switch-btn.active{
    border-color:var(--accent);
    background:rgba(45,38,25,.72);
    box-shadow:0 0 20px rgba(232,189,92,.22);
  }
  .sound-switch-btn:hover{
    background:rgba(45,40,32,.78);
  }
  .sound-switch-btn:active{
    transform:scale(.97);
  }

  .keyboard{margin-top:8px;display:flex;flex-direction:column;gap:30px;padding:22px 18px 28px;
    background:radial-gradient(700px 260px at 50% 0%, rgba(232,189,92,.07), transparent 70%), var(--surface);
    border:1px solid var(--line);border-radius:14px;}
  .staff-row{display:flex;align-items:center;gap:16px;}
  .clef{flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .clef .symbol{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--accent);line-height:1;}
  .notes{position:relative;flex:1;display:flex;padding:0 8px;}
  .notes::before{content:'';position:absolute;left:8px;right:8px;top:29px;height:1px;background:rgba(246,237,219,.2);}
  .note-col{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;
    cursor:pointer;user-select:none;}
  .note-col .num{font-family:var(--font-mono);font-size:11px;color:var(--text-mute);transition:.15s;}
  .note-col .dot{width:9px;height:9px;border-radius:50%;background:var(--text-mute);
    box-shadow:0 0 0 4px var(--surface);transition:.15s;}
  .note-col .cap{font-family:var(--font-display);font-weight:700;font-size:15px;
    background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);color:var(--text);
    width:36px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,.35);transition:.12s ease;}
  .note-col:hover .cap{border-color:var(--accent-dim);}
  .note-col:hover .dot{background:var(--accent-dim);}
  .note-col.down .dot{background:var(--accent);box-shadow:0 0 0 4px var(--surface),0 0 10px var(--accent);}
  .note-col.down .cap{transform:translateY(2px);border-color:var(--accent);box-shadow:0 0 16px rgba(232,189,92,.55);
    background:linear-gradient(180deg,var(--accent-soft),var(--surface-2));}
  .note-col.down .num{color:var(--accent);}
  .note-col.flash .cap{animation:flashGold .35s ease-out;}
  @keyframes flashGold{0%{box-shadow:0 0 0 rgba(232,189,92,0);border-color:var(--accent);}40%{box-shadow:0 0 26px rgba(232,189,92,.75);}100%{box-shadow:0 0 0 rgba(232,189,92,0);}}

  .wave-wrap{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;}
  canvas#waveCanvas{display:block;width:100%;height:64px;opacity:.9;}
  .wave-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.25em;color:var(--text-mute);text-transform:uppercase;margin-top:4px;text-align:center;}

  footer{margin-top:34px;color:var(--text-mute);font-size:11.5px;font-family:var(--font-mono);text-align:center;letter-spacing:.05em;}

  @media (max-width:520px){
    .sound-switch-btn{width:104px;height:48px;padding:0 12px;}
    .sound-switch-btn .set-icon{font-size:23px;}
    .sound-switch-btn .set-number{font-size:12px;min-width:20px;height:20px;}
    h1{font-size:28px;}
    .note-col .cap{font-size:12px;width:28px;height:26px;}
    .note-col .num{font-size:9.5px;}
    .clef{flex:0 0 32px;width:32px;height:32px;}
    .clef .symbol{font-size:13px;}
    .staff-row{gap:8px;}
    .sliders{width:100%;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="sound-switch" aria-label="音色切り替え">
    <button class="sound-switch-btn left active" id="soundSet1Btn" type="button" aria-label="音色1">
      <span class="set-number">1</span>
      <span class="set-icon">♫</span>
    </button>
    <button class="sound-switch-btn right" id="soundSet2Btn" type="button" aria-label="音色2">
      <span class="set-icon">♫</span>
      <span class="set-number">2</span>
    </button>
  </div>

  <header>
    <div class="eyebrow">RESONANCE ETUDE — WUTHERING WAVES FAN TOOL</div>
    <h1>鳴潮 古琴演奏練習サイト<small></h1>
    <p class="tagline">クリック・タップ・物理キーボードのどれでも演奏できます。</p>
  </header>

  <section>
    <div class="section-label">音量</div>
    <div class="sliders">
      <div class="slider-group">
        <label><span>Volume</span><span id="volVal">70%</span></label>
        <input type="range" id="volSlider" min="0" max="100" value="70">
      </div>
    </div>
  </section>

  <section>
    <div class="section-label">演奏キー — 21鍵</div>
    <div class="keyboard">
      <div class="staff-row">
        <div class="clef"><span class="symbol">G</span></div>
        <div class="notes" id="row-high"></div>
      </div>
      <div class="staff-row">
        <div class="clef"><span class="symbol">C</span></div>
        <div class="notes" id="row-mid"></div>
      </div>
      <div class="staff-row">
        <div class="clef"><span class="symbol">F</span></div>
        <div class="notes" id="row-low"></div>
      </div>
    </div>
  </section>

  <div class="wave-wrap">
    <canvas id="waveCanvas"></canvas>
    <div class="wave-label">鳴潮 · resonance waveform</div>
  </div>

  <footer>Fan-made instrument tool, Not affiliated with Kuro Games.</footer>
</div>

<script>
(function(){
  "use strict";

  const ROWS = [
    { id:'row-high', keys:['Q','W','E','R','T','Y','U'], octave:1  },
    { id:'row-mid',  keys:['A','S','D','F','G','H','J'], octave:0  },
    { id:'row-low',  keys:['Z','X','C','V','B','N','M'], octave:-1 },
  ];
  const DEGREES = [0,2,4,5,7,9,11];
  const KEY_INFO = {};

  ROWS.forEach(row=>{
    row.keys.forEach((k,i)=>{
      const semitone = DEGREES[i] + 12*row.octave;
      const freq = 261.6256 * Math.pow(2, semitone/12);
      KEY_INFO[k] = { freq, degree:(i+1) };
    });
  });

  ROWS.forEach(row=>{
    const el = document.getElementById(row.id);
    row.keys.forEach(k=>{
      const col = document.createElement('div');
      col.className = 'note-col';
      col.dataset.key = k;
      col.innerHTML =
        '<span class="num">'+KEY_INFO[k].degree+'</span>'+
        '<span class="dot"></span>'+
        '<span class="cap">'+k+'</span>';
      col.addEventListener('mousedown', ()=>handlePress(k));
      col.addEventListener('touchstart', (e)=>{e.preventDefault();handlePress(k);}, {passive:false});
      el.appendChild(col);
    });
  });

  function keyEl(k){ return document.querySelector('.note-col[data-key="'+k+'"]'); }

  // サイト製作者があらかじめ指定する2種類の音声ファイル。
  // フォルダ構成:
  // audio/1/Q.mp3 ～ audio/1/M.mp3
  // audio/2/Q.mp3 ～ audio/2/M.mp3
  const AUDIO_SETS = {
    1: {
      Q:'audio/1/Q.mp3', W:'audio/1/W.mp3', E:'audio/1/E.mp3', R:'audio/1/R.mp3',
      T:'audio/1/T.mp3', Y:'audio/1/Y.mp3', U:'audio/1/U.mp3',
      A:'audio/1/A.mp3', S:'audio/1/S.mp3', D:'audio/1/D.mp3', F:'audio/1/F.mp3',
      G:'audio/1/G.mp3', H:'audio/1/H.mp3', J:'audio/1/J.mp3',
      Z:'audio/1/Z.mp3', X:'audio/1/X.mp3', C:'audio/1/C.mp3', V:'audio/1/V.mp3',
      B:'audio/1/B.mp3', N:'audio/1/N.mp3', M:'audio/1/M.mp3'
    },
    2: {
      Q:'audio/2/Q.mp3', W:'audio/2/W.mp3', E:'audio/2/E.mp3', R:'audio/2/R.mp3',
      T:'audio/2/T.mp3', Y:'audio/2/Y.mp3', U:'audio/2/U.mp3',
      A:'audio/2/A.mp3', S:'audio/2/S.mp3', D:'audio/2/D.mp3', F:'audio/2/F.mp3',
      G:'audio/2/G.mp3', H:'audio/2/H.mp3', J:'audio/2/J.mp3',
      Z:'audio/2/Z.mp3', X:'audio/2/X.mp3', C:'audio/2/C.mp3', V:'audio/2/V.mp3',
      B:'audio/2/B.mp3', N:'audio/2/N.mp3', M:'audio/2/M.mp3'
    }
  };

  let currentSoundSet = 1;

  function playFile(k){
    const src = AUDIO_SETS[currentSoundSet][k];
    if(!src) return;

    // キーを押すたびに新しいAudioを作るので、連打・重複再生にも対応。
    const audio = new Audio(src);
    audio.volume = Number(volSlider.value) / 100;
    audio.currentTime = 0;

    audio.play().catch(err=>{
      console.warn('音声ファイルを再生できませんでした:', src, err);
    });
  }

  function handlePress(k){
    if(!KEY_INFO[k]) return;

    playFile(k);

    const el = keyEl(k);
    if(el){
      el.classList.add('down');
      setTimeout(()=>el.classList.remove('down'), 110);
      flashKey(k);
    }
    pulseWave(0.8);
  }
  function flashKey(k){
    const el = keyEl(k);
    if(!el) return;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'), 360);
  }

  const soundSet1Btn = document.getElementById('soundSet1Btn');
  const soundSet2Btn = document.getElementById('soundSet2Btn');

  function selectSoundSet(setNumber){
    currentSoundSet = setNumber;
    soundSet1Btn.classList.toggle('active', setNumber === 1);
    soundSet2Btn.classList.toggle('active', setNumber === 2);
  }

  soundSet1Btn.addEventListener('click', ()=>selectSoundSet(1));
  soundSet2Btn.addEventListener('click', ()=>selectSoundSet(2));

  document.addEventListener('keydown', (e)=>{
    if(e.repeat) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const k = (e.key||'').toUpperCase();
    if(KEY_INFO[k]) handlePress(k);
  });

  const volSlider = document.getElementById('volSlider');
  document.getElementById('volVal').textContent = volSlider.value+'%';
  volSlider.addEventListener('input', ()=>{
    document.getElementById('volVal').textContent = volSlider.value+'%';
  });

  const waveCanvas = document.getElementById('waveCanvas');
  const waveCtx = waveCanvas.getContext('2d');
  let waveBoost = 0;
  function pulseWave(strength){ waveBoost = Math.min(1, waveBoost + (strength||0.6)); }
  function fitWave(){
    const dpr = window.devicePixelRatio||1;
    const rect = waveCanvas.getBoundingClientRect();
    waveCanvas.width = Math.max(1, rect.width*dpr);
    waveCanvas.height = Math.max(1, rect.height*dpr);
    waveCtx.setTransform(dpr,0,0,dpr,0,0);
  }
  function drawWave(now){
    const w = waveCanvas.clientWidth, h = waveCanvas.clientHeight;
    if(Math.round(waveCanvas.width) !== Math.round(w*(window.devicePixelRatio||1))) fitWave();
    waveCtx.clearRect(0,0,w,h);
    waveBoost *= 0.94;
    const amp = 3 + waveBoost*16;
    waveCtx.beginPath();
    for(let x=0;x<=w;x+=4){
      const y = h/2 + Math.sin((x*0.045)+(now/380)) * amp * Math.sin((x/w)*Math.PI);
      if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
    }
    waveCtx.strokeStyle = 'rgba(232,189,92,'+(0.55+waveBoost*0.4)+')';
    waveCtx.lineWidth = 2;
    waveCtx.stroke();
  }
  function loop(now){ drawWave(now); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  window.addEventListener('resize', fitWave);

  document.getElementById('unlockBtn').addEventListener('click', ()=>{
    document.getElementById('unlock').style.display='none';
  });

  fitWave();
})();
</script>
</body>
</html>
